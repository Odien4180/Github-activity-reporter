# This file is generated by github-activity-reporter.
# Re-run `github-activity-reporter install-workflow` after changing the schedule.
name: Update GitHub activity report

on:
  workflow_dispatch:
  schedule:
    # daily at 07:15 Asia/Seoul (cron: 15 22 * * * UTC)
    - cron: "15 22 * * *"

permissions:
  contents: read
  models: read

concurrency:
  group: activity-report
  cancel-in-progress: false

jobs:
  update-activity-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout reporter source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Checkout profile repository
        uses: actions/checkout@v5
        with:
          repository: Odien4180/Odien4180
          ref: master
          path: profile-repository
          token: ${{ secrets.ACTIVITY_REPORTER_GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore GitHubActivityReporter.sln

      - name: Build
        run: dotnet build GitHubActivityReporter.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test GitHubActivityReporter.sln --configuration Release --no-build

      - name: Configure profile repository Git identity
        run: |
          git -C profile-repository config user.name "github-actions[bot]"
          git -C profile-repository config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Generate and publish activity report
        env:
          ACTIVITY_REPORTER_GITHUB_TOKEN: ${{ secrets.ACTIVITY_REPORTER_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: dotnet run --project src/GitHubActivityReporter.Cli --configuration Release --no-build -- run --config activity-reporter.github-models.yml --profile-path profile-repository --verbose

      - name: Validate generated output
        run: dotnet run --project src/GitHubActivityReporter.Cli --configuration Release --no-build -- validate --config activity-reporter.github-models.yml --path profile-repository/generated

      - name: Detect profile changes
        id: profile_changes
        run: |
          if [ -n "$(git -C profile-repository status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push profile changes
        if: steps.profile_changes.outputs.changed == 'true'
        run: |
          git -C profile-repository add -A
          git -C profile-repository commit --amend --no-edit --reset-author
          git -C profile-repository push origin HEAD:master --force

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: artifacts/pages

  deploy-pages:
    needs: update-activity-report
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
