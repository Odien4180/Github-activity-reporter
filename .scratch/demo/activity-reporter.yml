version: 1
github:
  username: octocat
  profile_repository:
    owner: example-user
    name: example-user
    branch: main
  token_secret_name: ACTIVITY_REPORTER_GITHUB_TOKEN
collection:
  period:
    mode: since-last-success
    initial_lookback: 3650d
  public:
    enabled: true
    event_types:
      commits: true
      pull_requests_opened: true
      pull_requests_merged: true
      pull_requests_closed: false
      issues_opened: true
      issues_closed: true
      reviews: true
      releases: true
  private:
    enabled: true
    event_types:
      commits: true
      pull_requests_opened: true
      pull_requests_merged: true
      pull_requests_closed: false
      issues_opened: false
      issues_closed: true
      reviews: true
      releases: false
privacy:
  public:
    expose_repository_names: true
    expose_repository_links: true
    expose_repository_descriptions: true
    expose_pull_request_titles: true
    expose_issue_titles: true
    expose_release_names: true
    expose_languages: true
    expose_topics: false
    expose_commit_messages: false
    ai_summary: false
  private:
    mode: aggregate-only
    expose_active_repository_count: true
    expose_commit_count: true
    expose_pull_request_opened_count: true
    expose_pull_request_merged_count: true
    expose_pull_request_closed_count: false
    expose_issue_opened_count: false
    expose_issue_closed_count: true
    expose_review_count: true
    expose_release_count: false
    expose_active_day_count: true
    expose_repository_names: false
    expose_repository_aliases: false
    expose_organization_names: false
    expose_titles: false
    expose_links: false
    expose_commit_messages: false
    expose_branch_names: false
    expose_file_paths: false
    expose_topics: false
    ai_summary: false
  custom_forbidden_terms: []
summary:
  language: ko
  style: concise
  max_public_repositories: 5
  max_items_per_repository: 3
outputs:
  github_profile:
    enabled: true
    renderer: compact-markdown
    target: generated/activity.md
  json:
    enabled: true
    renderer: normalized-json
    target: generated/report.json
  dashboard:
    enabled: false
    renderer: svg-dashboard
    target: generated/activity-dashboard.svg
  website:
    enabled: false
    renderer: static-html
    output_directory: generated/site
    history_days: 30
  email:
    enabled: false
    renderer: email-html
    html_target: generated/email.html
    text_target: generated/email.txt
  slack:
    enabled: false
    renderer: slack-blocks
    target: generated/slack.json
publishers:
  github_profile:
    enabled: true
  github_pages:
    enabled: false
  email:
    enabled: false
    secret_name: EMAIL_CREDENTIALS
  slack:
    enabled: false
    secret_name: SLACK_WEBHOOK_URL
  local:
    enabled: true
    output_directory: artifacts
schedule:
  enabled: true
  timezone: Asia/Seoul
  local_time: 09:00
  frequency: daily
