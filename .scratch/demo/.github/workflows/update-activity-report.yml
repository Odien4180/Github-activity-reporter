# This file is generated by github-activity-reporter.
# Re-run `github-activity-reporter install-workflow` after changing the schedule.
name: Update GitHub activity report

on:
  workflow_dispatch:
  schedule:
    # daily at 09:00 Asia/Seoul (cron: 0 0 * * * UTC)
    - cron: "0 0 * * *"

permissions:
  contents: write

concurrency:
  group: activity-report
  cancel-in-progress: false

jobs:
  update-activity-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore GitHubActivityReporter.sln

      - name: Build
        run: dotnet build GitHubActivityReporter.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test GitHubActivityReporter.sln --configuration Release --no-build

      - name: Generate activity report
        env:
          ACTIVITY_REPORTER_GITHUB_TOKEN: ${{ secrets.ACTIVITY_REPORTER_GITHUB_TOKEN }}
        run: dotnet run --project src/GitHubActivityReporter.Cli --configuration Release --no-build -- run --config activity-reporter.yml

      - name: Validate generated output
        run: dotnet run --project src/GitHubActivityReporter.Cli --configuration Release --no-build -- validate --config activity-reporter.yml

      - name: Detect changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(profile): update GitHub activity report"
          git push origin HEAD:main
